name: CMS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cms-ci:
    name: CMS Verification and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CMS unit and DAL test suite
        run: npm run test:cms

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build the Astro/Cloudflare Worker
        env:
          # Build locally without connecting the AI binding to a real account.
          # This does not remove any binding from the deployable Worker config.
          CLOUDFLARE_VITE_FORCE_LOCAL: "true"
        run: npm run build

  deploy:
    name: Deploy production
    needs: cms-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-cms-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD || vars.CF_ACCESS_AUD }}
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Check required configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_D1_DATABASE_ID CF_R2_BUCKET_NAME CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production configuration: $name" >&2
              exit 1
            fi
          done

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production resource bindings
        run: node scripts/build/verify-bindings.mjs --env production

      - name: Build for production
        run: CLOUDFLARE_VITE_FORCE_LOCAL=true CLOUDFLARE_ENV=production npm run build

      - name: Deploy production Worker
        run: npx wrangler deploy --env production

      - name: Verify public search and anonymous Earth protection
        run: node scripts/build/verify-search.mjs
