name: CMS staging deploy pipeline

on:
  repository_dispatch:
    types: [cms-staging-deploy, cms-staging-release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (skips real deploy)'
        required: false
        default: false
        type: boolean
      release_id:
        description: 'Release ID for staging deploy'
        required: false
        type: string
      attempt_id:
        description: 'Release attempt ID to confirm/fail via callback'
        required: false
        type: string
      manifest_sha256:
        description: 'Expected public manifest SHA-256'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cms-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Staging Deploy Pipeline
    runs-on: ubuntu-latest
    environment: cms-staging
    timeout-minutes: 15
    env:
      # Cloudflare credentials — SSOT names (docs/cms/environment-map.md).
      # Legacy fallbacks (CF_API_TOKEN, CF_ACCOUNT_ID) are temporary for
      # backward compatibility with previously configured environments.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CF_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      # Required env vars with a fallback between secrets and vars, so a value
      # configured as a GitHub environment Variable (not a Secret) still reaches
      # the pre-flight verification step instead of arriving empty.
      # SSOT names first; legacy names (STAGING_D1_DATABASE_ID, STAGING_R2_BUCKET_NAME)
      # remain as temporary fallbacks.
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN || vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD || vars.CF_ACCESS_AUD }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID || secrets.CF_D1_DATABASE_ID || vars.STAGING_D1_DATABASE_ID || secrets.STAGING_D1_DATABASE_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME || vars.STAGING_R2_BUCKET_NAME || secrets.STAGING_R2_BUCKET_NAME || 'portfolio-media-staging' }}
      # No legacy STAGING_D1_DATABASE_ID/STAGING_R2_BUCKET_NAME aliases here: a
      # job-level env: entry cannot reference a sibling entry via env.*, and
      # verify-bindings.mjs already falls back to those legacy names itself.
      # Security guard: Dev bypass must never be enabled in staging
      ENABLE_ACCESS_DEV_BYPASS: "false"
      # Release tracking
      CMS_RELEASE_ID: ${{ github.event.client_payload.release_id || inputs.release_id }}
      CMS_ATTEMPT_ID: ${{ github.event.client_payload.attempt_id || inputs.attempt_id }}
      CMS_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 || inputs.manifest_sha256 }}
      IS_DRY_RUN: ${{ (inputs.dry_run == true || github.event.client_payload.dry_run == true) && 'true' || 'false' }}
      # Release confirmation/failure callback
      CMS_STAGING_HOST: https://cms-staging.frong.me
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      RELEASE_CALLBACK_SECRET: ${{ secrets.RELEASE_CALLBACK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight binding and security verification
        run: node scripts/build/verify-bindings.mjs

      - name: Build application for staging
        env:
          CLOUDFLARE_ENV: staging
        run: npm run build

      - name: Deploy targeting env.staging
        id: deploy
        env:
          # Disables wrangler's post-deploy telemetry POST. Confirmed by run 34665791591:
          # the Worker deployed successfully (visible "Current Version ID:" and a live
          # workers.dev URL) but `wrangler` still exited non-zero right after that call,
          # which — now that pipefail correctly propagates real failures — flipped the
          # step to a false failure. Telemetry adds no value to a CI deploy anyway.
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -uo pipefail
          mkdir -p .wrangler/deploy-result
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[deploy] Executing dry-run deploy targeting env.staging only..."
            npx wrangler deploy --env staging --dry-run --outdir .wrangler/dry-run 2>&1 | tee .wrangler/deploy-result/wrangler-deploy.log
            DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
            DEPLOY_URL="https://cms-staging.frong.me"
            DEPLOYMENT_ID="dry-run-${{ github.run_id }}"
            MODE="dry-run"
          else
            echo "[deploy] Executing real deploy targeting env.staging only..."
            npx wrangler deploy --env staging 2>&1 | tee .wrangler/deploy-result/wrangler-deploy.log
            DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
            DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev|https://cms-staging\.frong\.me' .wrangler/deploy-result/wrangler-deploy.log | head -n 1)
            DEPLOY_URL=${DEPLOY_URL:-https://cms-staging.frong.me}
            DEPLOYMENT_ID=$(grep -oE 'Current Deployment ID: [a-f0-9-]+|Deployment ID: [a-f0-9-]+' .wrangler/deploy-result/wrangler-deploy.log | head -n 1 | awk '{print $NF}')
            DEPLOYMENT_ID=${DEPLOYMENT_ID:-${{ github.run_id }}}
            MODE="live"
          fi

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
            MODE="failed"
          fi

          echo "Deployment finished."
          echo "Environment: staging"
          echo "Mode: $MODE"
          echo "Deploy exit code: $DEPLOY_EXIT_CODE"
          echo "Deploy URL: $DEPLOY_URL"
          echo "Deployment ID: $DEPLOYMENT_ID"

          cat <<EOF > .wrangler/deploy-result/deployment-result.json
          {
            "environment": "staging",
            "mode": "$MODE",
            "url": "$DEPLOY_URL",
            "deploymentId": "$DEPLOYMENT_ID",
            "releaseId": "${{ env.CMS_RELEASE_ID }}",
            "manifestSha256": "${{ env.CMS_MANIFEST_SHA256 }}",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
            echo "::error::wrangler deploy exited with code $DEPLOY_EXIT_CODE"
            exit "$DEPLOY_EXIT_CODE"
          fi

      - name: Log deploy result as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-staging-deploy-result-${{ github.run_id }}
          path: |
            .wrangler/deploy-result/
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm release live
        if: success() && env.IS_DRY_RUN != 'true' && env.CMS_RELEASE_ID != '' && env.CMS_ATTEMPT_ID != ''
        run: |
          DEPLOYMENT_ID=$(node -e "console.log(require('./.wrangler/deploy-result/deployment-result.json').deploymentId)")
          curl --fail-with-body --silent --show-error \
            --request POST "$CMS_STAGING_HOST/earth/api/releases/$CMS_RELEASE_ID/confirm" \
            --header "content-type: application/json" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "X-Release-Callback-Secret: $RELEASE_CALLBACK_SECRET" \
            --data "{\"attemptId\":\"$CMS_ATTEMPT_ID\",\"providerDeploymentId\":\"$DEPLOYMENT_ID\",\"workflowRunId\":\"${{ github.run_id }}\"}"

      - name: Report deploy failure
        if: failure() && env.CMS_RELEASE_ID != '' && env.CMS_ATTEMPT_ID != ''
        run: |
          ERROR_MESSAGE="Staging deploy workflow run ${{ github.run_id }} failed"
          curl --fail-with-body --silent --show-error \
            --request POST "$CMS_STAGING_HOST/earth/api/releases/$CMS_RELEASE_ID/fail" \
            --header "content-type: application/json" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "X-Release-Callback-Secret: $RELEASE_CALLBACK_SECRET" \
            --data "{\"attemptId\":\"$CMS_ATTEMPT_ID\",\"errorMessage\":\"$ERROR_MESSAGE\",\"workflowRunId\":\"${{ github.run_id }}\"}"
