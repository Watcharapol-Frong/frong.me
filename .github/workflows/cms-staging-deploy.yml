name: CMS staging release proof

on:
  repository_dispatch:
    types: [cms-staging-release]
  workflow_dispatch:
    inputs:
      release_id:
        description: Release ID for a manual staging proof
        required: true
        type: string
      manifest_sha256:
        description: Expected public manifest SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cms-staging-release
  cancel-in-progress: false

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    environment: cms-staging
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/cloudflare-architecture
    env:
      CMS_RELEASE_ID: ${{ github.event.client_payload.release_id || inputs.release_id }}
      CMS_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 || inputs.manifest_sha256 }}
      CMS_WRANGLER_CONFIG: .generated/wrangler.staging.jsonc
      CMS_SITE_ORIGIN: ${{ vars.CMS_SITE_ORIGIN }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      CF_ACCESS_ALLOWED_EMAIL: ${{ secrets.CF_ACCESS_ALLOWED_EMAIL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_READ_TOKEN: ${{ secrets.CF_D1_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/cloudflare-architecture/package-lock.json

      - name: Validate dispatch payload
        if: github.event_name == 'repository_dispatch'
        run: node scripts/validate-dispatch.mjs "$GITHUB_EVENT_PATH"

      - name: Install pinned spike dependencies
        run: npm ci

      - name: Generate ephemeral staging configuration
        run: npm run config:staging

      - name: Run architecture checks
        run: npm test

      - name: Fetch immutable public release snapshot
        run: npm run d1:snapshot

      - name: Build the requested release
        run: npm run build

      - name: Prove deploy bundle without changing staging
        run: npm run deploy:dry

      - name: Deploy staging after environment approval
        if: vars.CMS_SPIKE_DEPLOY == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
        run: npm run deploy:staging

      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-spike-${{ env.CMS_RELEASE_ID }}-${{ github.run_id }}
          path: |
            spikes/cloudflare-architecture/dist/client
            spikes/cloudflare-architecture/.wrangler/dry-run
          if-no-files-found: warn
          retention-days: 7
