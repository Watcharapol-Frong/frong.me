name: Deploy CMS production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Check required configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_D1_DATABASE_ID CF_R2_BUCKET_NAME CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production configuration: $name" >&2
              exit 1
            fi
          done

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CMS tests
        run: npm run test:cms

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Verify production resource bindings
        run: node scripts/build/verify-bindings.mjs --env production

      - name: Build for production
        run: CLOUDFLARE_ENV=production npm run build

      - name: Deploy production Worker
        run: npx wrangler deploy --env production
